<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Paarth Infotech provides practical software training and builds web, cloud and enterprise applications using .NET, React and Dynamics 365." />
    <meta name="theme-color" content="#081321" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("theme");
          const theme =
            savedTheme === "light" || savedTheme === "dark"
              ? savedTheme
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";

          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <title>Paarth Infotech</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
